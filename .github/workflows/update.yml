name: update-data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl pandas google-api-python-client google-auth cryptography
      - name: Download Excel from Drive
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: python fetch_from_drive.py book.xlsx
      - name: Convert
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          PROJECT: ""
        run: python -W ignore convert.py book.xlsx data.json
      - name: Commit if changed
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            cp data.enc.json /tmp/data.enc.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.enc.json data.enc.json
            git add data.enc.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -m "auto update data"
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected, retrying ($i)"; sleep 5
          done
          exit 1
